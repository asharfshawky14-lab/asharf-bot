<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صاروخ التحميل 🚀</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
    }

    .box {
      width: 100%;
      max-width: 430px;
      text-align: center;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 25px;
      padding: 35px 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .rocket {
      font-size: 75px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 5px 0 12px;
      font-size: 30px;
    }

    p {
      color: #dbeafe;
      line-height: 1.8;
      font-size: 16px;
    }

    .button {
      display: block;
      margin-top: 25px;
      padding: 16px;
      border-radius: 15px;
      background: #229ED9;
      color: white;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;
    }

    .button:active {
      transform: scale(0.97);
    }

    .small {
      margin-top: 22px;
      font-size: 13px;
      color: #bfdbfe;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="rocket">🚀</div>

    <h1>صاروخ التحميل</h1>

    <p>
      حمّل فيديوهاتك بسهولة وسرعة من
      يوتيوب وتيك توك وفيسبوك وإنستجرام وغيرها.
    </p>

    <a class="button" href="https://t.me/AshrafVideoDL_bot">
      🚀 افتح البوت على تيليجرام
    </a>

    <div class="small">
      بواسطة أشرف شوقي ❤️
    </div>

  </div>

</body>
</html>
